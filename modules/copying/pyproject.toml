[project]
name = "flet-copying"
version = "0.1.0"
description = "Holds each member's trade-only agent key on the venue."
requires-python = ">=3.12"
# ADR-0001: the venue's official SDK signs trading actions as the member's agent; Fernet
# holds the key at rest. Nothing here may ever sign with a member's main key.
dependencies = ["hyperliquid-python-sdk==0.24.0", "cryptography>=43"]

[project.scripts]
copying = "copying.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copying"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The SDK ships no type information.
module = ["hyperliquid.*", "eth_account.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["venue: reaches the venue's testnet; needs FLET_TESTNET_MAIN_KEY"]
